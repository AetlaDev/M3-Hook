<!--测试网页-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M3 Hook</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 48px;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f6f2fb;
      color: #1d1b20;
    }
    .mock {
      max-width: 720px;
      padding: 32px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .mock h1 { margin: 0 0 12px; font-size: 22px; }
    .mock p { margin: 0; color: #625b71; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="mock">
    <h1>模拟ccw作品详情页</h1>
    <p>此页面仅用于本地预览 M3 Hook 悬浮面板，右下角应出现面板，可展开与折叠。</p>
  </main>
  <div hidden>
    <div class="loadingProgressTips-mock">努力加载中 0%</div>
  </div>
  <script>
    setTimeout(() => {
      const stage = document.createElement('div');
      stage.className = 'ccw-stage-wrapper';
      document.body.appendChild(stage);
    }, 1500);
    setTimeout(() => {
      const tips = document.querySelector('[class*="loadingProgressTips-"]');
      if (tips) tips.remove();
    }, 4500);
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
